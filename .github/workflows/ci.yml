name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # The generated localizations are committed, so an edit to the .arb that
      # skipped `flutter gen-l10n` would otherwise sit there analyzing and
      # testing perfectly against stale strings.
      - name: Verify localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated \
            || { echo "::error::lib/l10n is out of date — run flutter gen-l10n"; exit 1; }

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded --coverage

      # Printed rather than uploaded: no third-party token to keep alive, and
      # the number is right there in the log next to the run that produced it.
      - name: Coverage summary
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
