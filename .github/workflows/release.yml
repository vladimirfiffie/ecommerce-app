name: Release

# Three ways to cut a build:
#
#   1. Bump `version:` in pubspec.yaml and push to main. The release is cut
#      for you and the tag is created server-side — no local tag push, which
#      is the step that used to strand a release on a machine that could
#      commit but not push tags.
#   2. Push a tag yourself:  git tag v0.1.0 && git push origin v0.1.0
#   3. Run this workflow by hand from the Actions tab.
#
# Tags containing a hyphen (v0.1.0-beta.1) are treated as prereleases.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version label for a manual build (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  # Cheap gate, so an ordinary commit to main doesn't spend ten minutes
  # building an APK for a version that has already shipped.
  decide:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and decide
        id: resolve
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            workflow_dispatch) TAG="${{ inputs.tag }}" ;;
            *)
              if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
                TAG="${GITHUB_REF_NAME}"
              else
                # pubspec is the source of truth on a branch push. A test
                # already pins it to lib/core/release_notes.dart, so the tag,
                # the in-app "What's new" sheet and the published notes
                # cannot name three different versions.
                VERSION=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
                if [ -z "$VERSION" ]; then
                  echo "::error::could not read version from pubspec.yaml"
                  exit 1
                fi
                TAG="v${VERSION}"
              fi
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Only hyphenated tags (v0.4.0-beta.1) are prereleases. A plain
          # vX.Y.Z is a full release, so GitHub gives it the "Latest" badge —
          # marking everything prerelease leaves /releases/latest a 404 and
          # the releases page looking like a bare list of tags.
          case "$TAG" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          # A branch push only releases a version that hasn't shipped. Without
          # this, every commit to main would try to republish the same tag.
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE:-branch}" = "branch" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is already released — bump version in pubspec.yaml to cut a new one."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing ${TAG}"
          fi

  android:
    name: Build Android
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle 9.1 supports Java 17 up to (but not including) 26.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Debug-signed: this is a test build, not a Play Store artifact.
      # Installing it requires "install from unknown sources".
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename artifacts
        run: |
          mkdir -p dist
          V="${{ needs.decide.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/aster-${V}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "dist/aster-${V}-${abi}.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: aster-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Generate release notes
        run: |
          dart run tool/generate_release_notes.dart \
            "${{ needs.decide.outputs.tag }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # No `if` here any more: the decide job already settled whether this
      # version should ship, and a branch push has to publish too or
      # releasing from main doesn't happen at all.
      #
      # tag_name is what makes that work — the action creates the tag at this
      # commit when it doesn't exist yet, so nobody has to push one.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.decide.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ needs.decide.outputs.prerelease == 'false' }}
          name: Aster ${{ needs.decide.outputs.tag }}
          files: dist/*.apk
          # Same copy as the in-app "What's new" sheet, generated from
          # lib/core/release_notes.dart so the two can't drift.
          body_path: RELEASE_NOTES.md
