name: Release

# Push a tag to cut a build:
#   git tag v0.1.0 && git push origin v0.1.0
# Tags containing a hyphen (v0.1.0-beta.1) are also treated as prereleases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version label for a manual build (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 9.1 supports Java 17 up to (but not including) 26.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Resolve version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Only hyphenated tags (v0.4.0-beta.1) are prereleases. A plain
          # vX.Y.Z is a full release, so GitHub gives it the "Latest" badge —
          # marking everything prerelease leaves /releases/latest a 404 and
          # the releases page looking like a bare list of tags.
          case "$TAG" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Publishing ${TAG} as prerelease=$(case "$TAG" in *-*) echo true;; *) echo false;; esac)"

      # Debug-signed: this is a test build, not a Play Store artifact.
      # Installing it requires "install from unknown sources".
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename artifacts
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/aster-${V}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "dist/aster-${V}-${abi}.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: aster-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Generate release notes
        run: |
          dart run tool/generate_release_notes.dart \
            "${{ steps.version.outputs.tag }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          name: Aster ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          # Same copy as the in-app "What's new" sheet, generated from
          # lib/core/release_notes.dart so the two can't drift.
          body_path: RELEASE_NOTES.md
