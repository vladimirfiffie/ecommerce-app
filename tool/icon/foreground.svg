<!--
  Aster's launcher mark: twelve rays around a solid centre.

  Drawn on the 108dp adaptive-icon canvas. Everything sits inside the centre
  66dp circle, which is all a launcher guarantees it will show — the rest can
  be cropped to a circle, a squircle or a teardrop depending on the device.

  One flat colour, so this doubles as the monochrome (themed icon) layer.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <g transform="translate(54 54)" fill="#FFFFFF">
    <g>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(0)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(30)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(60)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(90)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(120)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(150)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(180)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(210)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(240)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(270)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(300)"/>
      <ellipse rx="3.6" ry="14.5" cy="-14" transform="rotate(330)"/>
    </g>
    <circle r="9.5"/>
  </g>
</svg>
