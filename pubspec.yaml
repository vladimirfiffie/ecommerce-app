name: ecommerce_app
description: "Nova — a Material 3 storefront built entirely in Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  dynamic_color: ^1.9.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  haptic_kit: ^2.1.3
  intl: ^0.20.3
  local_auth: ^3.0.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  local_auth_platform_interface: ^1.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/catalog.json
