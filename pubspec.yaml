name: ecommerce_app
description: "Aster — a Material 3 storefront built entirely in Flutter."
publish_to: 'none'
version: 0.15.1+20

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  # Held at 1.x. dynamic_color 2.x is built on the material_ui package, so
  # taking it means moving the whole app there — which was tried, and reverted.
  # Localizations were not the problem: material_ui ships its own
  # GlobalMaterialLocalizations covering 116 locales. go_router is. It builds
  # the framework's MaterialPage, so every route becomes a framework
  # MaterialPageRoute that looks up a framework PageTransitionsTheme — and an
  # app themed by material_ui has none to find. The page transitions simply
  # stop, which no test catches because none of them assert a transition.
  # Revisit when go_router builds material_ui's pages.
  dynamic_color: ^1.9.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  haptic_kit: ^2.1.3
  http: ^1.6.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  pdf: ^3.13.0
  printing: ^5.15.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  adaptive_platform_ui: ^0.1.111

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  local_auth_platform_interface: ^1.1.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

