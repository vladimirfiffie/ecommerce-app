name: ecommerce_app
description: "Aster — a Material 3 storefront built entirely in Flutter."
publish_to: 'none'
version: 0.15.0+19

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  # Held at 1.x deliberately. dynamic_color 2.x is built on the material_ui
  # package rather than package:flutter/material.dart, and its ColorScheme is
  # a different class from the framework's — so taking it means migrating the
  # whole app onto material_ui. That migration is currently blocked: the SDK's
  # flutter_localizations still targets package:flutter/material.dart, so
  # material_ui's widgets can't find a MaterialLocalizations delegate and a
  # localized app warns "no delegate that supports the es locale was found".
  # Revisit when the SDK ships localizations for material_ui.
  dynamic_color: ^1.9.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  haptic_kit: ^2.1.3
  http: ^1.6.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  pdf: ^3.13.0
  printing: ^5.15.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  local_auth_platform_interface: ^1.1.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

